# Автообновление списка треков (music/tracks.json).
# Срабатывает: сразу при любом изменении папки music, каждые 5 минут (страховка) и вручную.
# Работает с обычным режимом Pages: Settings -> Pages -> Source: "Deploy from a branch".
name: Update track list

on:
  push:
    branches: [main, master]
    paths: ['music/**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-tracks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build music/tracks.json (newest first)
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          d = 'music'
          os.makedirs(d, exist_ok=True)
          files = [f for f in os.listdir(d) if re.search(r'\.(mp3|wav)$', f, re.I)]
          def added(f):
              out = subprocess.run(['git', 'log', '--diff-filter=A', '--format=%ct', '--', os.path.join(d, f)],
                                   capture_output=True, text=True).stdout.split()
              return int(out[-1]) if out else 0
          files.sort(key=lambda f: (-added(f), f.lower()))
          with open(os.path.join(d, 'tracks.json'), 'w', encoding='utf-8') as fh:
              json.dump(files, fh, ensure_ascii=False, indent=1)
          print(len(files), 'tracks')
          PY

      - name: Commit the list only if it changed
        id: commit
        run: |
          if git diff --quiet -- music/tracks.json && [ -n "$(git ls-files music/tracks.json)" ]; then
            echo "Список не изменился, коммит не нужен"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/tracks.json
          git commit -m "Update track list [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages пересоберётся сам"
