<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<title>Плеер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{--bg:#14101f;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--text:#f4f1fa;--muted:#a59fb8;--accent:#8b7cff;--glow:#8b7cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{-webkit-tap-highlight-color:transparent;transition:background .6s;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.ambient{position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 40% at 25% 30%,var(--glow),transparent 70%),radial-gradient(35% 35% at 80% 75%,var(--glow),transparent 70%);opacity:.38;filter:blur(60px);transition:background 1s}
.app{position:relative;z-index:1;min-height:100%;max-width:1080px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:32px;align-items:center}
.now{display:flex;flex-direction:column;gap:22px;min-width:0}
.side{min-width:0}
.cover{aspect-ratio:1;width:100%;max-width:420px;border-radius:28px;overflow:hidden;background:var(--panel);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);position:relative;transition:transform .5s}
.meta h1{font:800 clamp(28px,4vw,42px)/1.05 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere}
.meta p{color:var(--muted);margin-top:8px;font-size:18px}
.seek{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek span{min-width:38px}.seek span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(to right,var(--glow) var(--p,0%),var(--line) var(--p,0%));cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);border:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:0}
input[type=range]:focus-visible,button:focus-visible,.item:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.controls{display:flex;align-items:center;justify-content:space-between;max-width:420px}
button{touch-action:manipulation;background:none;border:0;color:var(--text);cursor:pointer;display:grid;place-items:center;border-radius:50%;width:44px;height:44px;transition:background .2s,color .2s,transform .15s}
button:hover{background:var(--panel)}button:active{transform:scale(.92)}
button svg{width:22px;height:22px;fill:currentColor}
button.on{color:var(--glow)}
.play{width:68px;height:68px;background:var(--text);color:#14101f}
.play:hover{background:#fff}.play svg{width:28px;height:28px}
.vol{display:flex;align-items:center;gap:8px;max-width:420px}
.vol input{max-width:200px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 48px);min-height:160px}
.list{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:4px;flex:1;margin:0 -8px;padding:0 8px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto auto;min-width:0;gap:12px;align-items:center;padding:8px;border-radius:14px;cursor:pointer}
.item:hover{background:var(--panel)}
.item.cur{background:color-mix(in srgb,var(--glow) 24%,transparent)}
.item .t{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;display:grid;place-items:center;font:700 16px 'Bricolage Grotesque';color:#fff}
.item b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px;padding:24px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.themes{display:flex;flex-wrap:wrap;gap:12px;padding:4px}
.themes button{width:36px;height:36px;border-radius:50%;border:0;transition:box-shadow .2s,transform .15s}
.themes button:hover{transform:scale(1.12)}
.themes button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr);gap:20px;align-items:start;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
 .cover{width:min(78vw,340px);max-width:none;margin:0 auto;border-radius:24px}
 .meta{text-align:center}
 .controls,.vol{max-width:none}
 .controls button{width:48px;height:48px}
 .controls .play{width:72px;height:72px}
 .vol input{max-width:none}
 input[type=range]{height:8px}
 input[type=range]::-webkit-slider-thumb{width:22px;height:22px}
 input[type=range]::-moz-range-thumb{width:22px;height:22px}
 .side{max-height:none;border-radius:24px;padding:10px}
 .item{padding:10px 8px}
 .ambient{filter:blur(40px)}
}
#viz{width:100%;height:100%;display:block}
.cover{border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--glow) 18%,transparent),var(--panel))}
.top{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.badge{font-size:13px;color:var(--muted);background:var(--panel);padding:6px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.badge[hidden],.ov[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{width:min(440px,100%);max-height:92dvh;overflow:auto;background:color-mix(in srgb,var(--bg) 90%,#fff);border:1px solid var(--line);border-radius:28px;padding:20px 22px calc(12px + env(safe-area-inset-bottom))}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{font:700 22px 'Bricolage Grotesque',sans-serif}
.row{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.row label b{color:var(--text);font-weight:500}
.seg{display:flex;background:var(--panel);border-radius:99px;padding:4px;gap:2px}
.seg button{width:auto;flex:1;height:36px;border-radius:99px;font:500 13px 'DM Sans',sans-serif}
.seg button[aria-pressed=true]{background:var(--glow);color:#14101f}
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;font:inherit;outline:none}
.tools input:focus-visible{border-color:var(--glow)}
.tools button{width:40px;height:40px;background:var(--panel)}
.fv{width:36px;height:36px;color:var(--muted);opacity:.45}
.fv.on,.tools button.on{color:var(--glow);opacity:1}
.fv svg,.tools svg{width:18px;height:18px}
@media(max-width:820px){.ov{align-items:flex-end}.sheet{border-radius:28px 28px 0 0}}
@media(min-width:821px) and (min-height:560px){
 html,body{overflow:hidden}
 .app{height:100dvh;min-height:0;max-width:1320px;padding:14px 32px 22px;gap:14px 44px;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);grid-template-rows:auto minmax(0,1fr);align-items:stretch}
 .now{min-height:0;gap:clamp(10px,2vh,20px)}
 .cover{aspect-ratio:auto;max-width:none;width:100%;flex:1 1 0;min-height:120px}
 .meta h1{font-size:clamp(24px,4.4vh,42px)}
 .meta p{font-size:clamp(14px,2vh,18px);margin-top:6px}
 .controls,.vol{max-width:none}
 .vol input{max-width:280px}
 .side{height:100%;max-height:none;min-height:0}
 .list{overscroll-behavior:contain}
}
/* телефоны и узкие экраны: прокручивается ТОЛЬКО страница, список не ловит палец */
@media(max-width:820px),(max-height:559px){
 .side{max-height:none;height:auto;min-height:0}
 .list{overflow:visible;flex:none}
}
@media(max-width:820px),(pointer:coarse){
 .side{backdrop-filter:none;-webkit-backdrop-filter:none;background:color-mix(in srgb,var(--bg) 82%,#fff)}
 .ov{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.7)}
 .ambient{filter:none}
}
input[type=range]{touch-action:pan-y}
@property --glow{syntax:'<color>';inherits:true;initial-value:#8b7cff}
@property --bg{syntax:'<color>';inherits:true;initial-value:#14101f}
:root{transition:--glow .9s ease,--bg .9s ease}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes swap{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) rotate(0) scale(1)}to{transform:translate3d(4%,3%,0) rotate(14deg) scale(1.15)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--glow) 60%,transparent)}100%{box-shadow:0 0 0 24px transparent}}
@keyframes eq{0%,100%{height:5px}50%{height:20px}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(34px) scale(.97)}}
.ambient{opacity:calc(.28 + var(--beat,0)*.45);animation:drift 26s ease-in-out infinite alternate;will-change:opacity,transform;transition:none}
.cover{transform:scale(calc(1 + var(--beat,0)*.035));transition:none;box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 calc(var(--beat,0)*100px) color-mix(in srgb,var(--glow) 50%,transparent)}
.top,.now>*,.side{animation:rise .85s cubic-bezier(.2,.8,.2,1) backwards}
.now>:nth-child(2){animation-delay:.08s}.now>:nth-child(3){animation-delay:.16s}.now>:nth-child(4){animation-delay:.24s}.now>:nth-child(5){animation-delay:.32s}.side{animation-delay:.2s}
.meta.swap{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
body.playing .play{animation:ring 1.8s ease-out infinite}
.play{transition:transform .15s,background .2s,box-shadow .3s}.play:hover{transform:scale(1.07)}
.item{transition:background .25s,transform .25s,box-shadow .25s}
.item:hover{transform:none}
.item:hover>:nth-child(2){transform:translateX(5px)}
.item>:nth-child(2){transition:transform .25s}
.item.cur{box-shadow:inset 3px 0 0 var(--glow)}
.item .t{transition:transform .25s}.item:hover .t{transform:scale(1.08) rotate(-3deg)}
.t.eqon{display:flex;gap:3px;align-items:flex-end;justify-content:center;padding-bottom:12px}
.t.eqon i{width:4px;height:5px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.t.eqon i:nth-child(2){animation-duration:.65s;animation-delay:-.3s}.t.eqon i:nth-child(3){animation-duration:1.1s;animation-delay:-.6s}
body:not(.playing) .t.eqon i{animation-play-state:paused}
.fv.on svg{animation:pop .45s}
input[type=range]::-webkit-slider-thumb{transition:transform .15s,box-shadow .2s;box-shadow:0 0 12px color-mix(in srgb,var(--glow) 70%,transparent)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.3)}
.ov:not([hidden]){animation:fade .25s}
.ov:not([hidden]) .sheet{animation:sheetIn .45s cubic-bezier(.2,.8,.2,1)}
.themes button:hover{transform:scale(1.2) rotate(8deg)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.dl{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.dl:hover{background:var(--panel);color:var(--text);transform:translateY(2px)}
.dl svg{width:18px;height:18px;fill:currentColor}
.dl:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media(max-width:820px){.item{gap:6px}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body.gl #bg{display:block}
body.gl .ambient{display:none}
.fxbtn{width:auto;height:auto;display:inline-flex;color:var(--text);border:1px solid var(--line);font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.fxbtn:hover{background:color-mix(in srgb,var(--glow) 30%,var(--panel))}
.fxbtn.on{background:var(--glow);color:#14101f;border-color:transparent}
.row input[type=range]:disabled{opacity:.4;cursor:not-allowed}
body.opt *,body.opt *::before,body.opt *::after{animation:none!important;transition:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;text-shadow:none!important}
body.opt .ambient{filter:none;opacity:.22;will-change:auto}
body.opt .cover{box-shadow:none!important;transform:none!important}
body.opt .side{background:color-mix(in srgb,var(--bg) 86%,#fff)}
body.opt .ov{background:rgba(0,0,0,.78)}
body.opt .item:hover>:nth-child(2),body.opt .item:hover .t{transform:none}
body.opt .play,body.opt input[type=range]::-webkit-slider-thumb{box-shadow:none}
.hint{font-size:12px;line-height:1.45;color:var(--muted)}
</style>
</head>
<body>
<div class="ambient" id="amb"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="app">
  <header class="top"><span class="badge" id="sleepBadge" hidden></span><button id="fxBtn" class="badge fxbtn" title="Режим звука (E)" aria-label="Режим звука"></button><button id="gear" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 24 24"><path d="M19.4 13c.1-.3.1-.7.1-1s0-.7-.1-1l2.1-1.6c.2-.2.2-.4.1-.6l-2-3.5c-.1-.2-.4-.3-.6-.2l-2.5 1c-.5-.4-1.1-.7-1.7-1l-.4-2.6c0-.2-.2-.4-.5-.4h-4c-.3 0-.5.2-.5.4L9.1 5.1c-.6.3-1.200.6-1.700 1l-2.500-1c-.2-.1-.5 0-.6.2l-2 3.500c-.1.200-.1.500.1.600L4.500 11c0 .3-.1.700-.1 1s0 .7.1 1l-2.100 1.600c-.2.200-.2.400-.1.600l2 3.500c.1.200.4.300.6.200l2.500-1c.5.400 1.100.7 1.700 1l.4 2.600c0 .2.200.4.500.4h4c.3 0 .5-.2.500-.4l.4-2.600c.6-.3 1.200-.6 1.700-1l2.500 1c.2.100.5 0 .6-.2l2-3.500c.1-.2.1-.5-.1-.6L19.400 13zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></button></header>
  <section class="now">
    <div class="cover" id="cover"><canvas id="viz"></canvas></div>
    <div class="meta"><h1 id="title">Загрузка…</h1><p id="artist">Ищу треки в папке music</p></div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div>
    <div class="controls">
      <button id="shuf" title="Перемешать (S)" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-3.2l-2.4 3.4-1.6-1.1L10.8 6H17V3zM3 7h4.3l7.1 10H17v-3l4 4-4 4v-3h-3.6L6.3 9H3V7zm0 10h3l2.2-3.1 1.6 1.1L7.7 19H3v-2z"/></svg></button>
      <button id="prev" title="Предыдущий (←)" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
      <button id="play" class="play" title="Играть / пауза (пробел)" aria-label="Играть"></button>
      <button id="next" title="Следующий (→)" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button id="rep" title="Повтор (R)" aria-label="Повтор"></button>
    </div>
    <div class="vol" id="volrow">
      <button id="mute" aria-label="Без звука" title="Без звука (M)"></button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость">
    </div>
  </section>
  <aside class="side">
    <div class="tools"><input type="search" id="q" placeholder="Поиск по трекам" aria-label="Поиск"><button id="favOnly" aria-label="Только избранное" title="Только избранное"><svg viewBox="0 0 24 24"><path d="M12 21s-8-4.900-10-10C.7 7.600 3 4 6.500 4 9 4 11 5.500 12 7.500 13 5.500 15 4 17.500 4 21 4 23.300 7.600 22 11c-2 5.100-10 10-10 10z"/></svg></button></div>
    <div class="list" id="list"></div>
  </aside>
</main>
<div class="ov" id="ov" hidden><div class="sheet" role="dialog" aria-label="Настройки">
  <div class="sh"><h2>Настройки</h2><button id="cls" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M19 6.400 17.600 5 12 10.600 6.400 5 5 6.400 10.600 12 5 17.600 6.400 19 12 13.400 17.600 19 19 17.600 13.400 12z"/></svg></button></div>
  <div class="row"><label>Оптимизация <b id="optv"></b></label><div class="seg" id="optseg"></div><p class="hint">Для слабых устройств и экономии батареи: без размытия, анимаций и WebGL-фона, лёгкая визуализация (24 кадра/с), без нагрузки в паузе. «Авто» включается на слабых устройствах и при разряженной батарее.</p></div>
  <div class="row"><label>Цвет оформления</label><div class="themes" id="themes"></div></div>
  <div class="row"><label>Визуализация</label><div class="seg" id="vizseg"></div></div>
  <div class="row"><label>Фон</label><div class="seg" id="bgseg"></div></div>
  <div class="row"><label>Сила подсветки под бит <b id="glv"></b></label><input type="range" id="gl" min="0" max="200" step="5"></div>
  <div class="row"><label>После окончания трека</label><div class="seg" id="autoseg"></div></div>
  <div class="row"><label>Режим звука</label><div class="seg" id="fxseg"></div></div>
  <div class="row"><label>Скорость <b id="spv"></b></label><input type="range" id="sp" min="50" max="200" step="5"></div>
  <div class="row"><label>Бас <b id="bsv"></b></label><input type="range" id="bs" min="-12" max="12" step="1"></div>
  <div class="row"><label>Высокие <b id="trv"></b></label><input type="range" id="tr" min="-12" max="12" step="1"></div>
  <div class="row"><label>Таймер сна</label><div class="seg" id="sleepseg"></div></div>
</div></div>
<audio id="audio" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id);
const audio=$('audio'),list=$('list');
const ICON={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
 muted:'<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.600l1.500 1.500A9 9 0 0 0 21 12c0-4.300-3-7.900-7-8.800v2.100c2.900.9 5 3.500 5 6.700zM4.300 3L3 4.300 7.700 9H3v6h4l5 5v-6.700l4.250 4.250c-.7.5-1.400.9-2.250 1.100v2.100a9 9 0 0 0 3.600-1.800L19.700 21 21 19.700 12 10.700 4.300 3zM12 4L9.900 6.100 12 8.200V4z"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>',

const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const hue=str=>{let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%360;return h};
const grad=t=>`linear-gradient(135deg,hsl(${hue(t)} 60% 55%),hsl(${(hue(t)+50)%360} 65% 38%))`;
const fill=el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');

function parseName(name){
  const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const m=base.split(/\s[-–—]\s/);
  return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'Неизвестный исполнитель',title:base};
}
function readTags(src,name){
  return new Promise(res=>{
    const fb=parseName(name);
    setTimeout(()=>res(fb),5000);
    if(!window.jsmediatags)return res(fb);
    jsmediatags.read(src,{
      onSuccess:({tags})=>res({title:tags.title||fb.title,artist:tags.artist||fb.artist}),
      onError:()=>res(fb)
    });
  });
}
function probeDuration(url){
  return new Promise(res=>{const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>res(a.duration);a.onerror=()=>res(0);a.src=url});
}

/* Теги/длительность читаем в очереди по 2 штуки и только после того, как текущий трек начал буферизоваться,
   чтобы не отбирать у него канал (раньше все треки запрашивались одновременно). */
const metaQ=[];let metaBusy=0,metaReady=false;
function updateMeta(t){
  $('title').textContent=t.title;$('artist').textContent=t.artist;document.title=`${t.title} — ${t.artist}`;
  if('mediaSession' in navigator&&window.MediaMetadata)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
}
function queueMeta(t,front){
  if(t._m)return;t._m=1;
  front?metaQ.unshift(t):metaQ.push(t);pumpMeta();
}
function pumpMeta(){
  if(!metaReady)return;
  while(metaBusy<2&&metaQ.length){
    const t=metaQ.shift();metaBusy++;
    Promise.all([tracks[idx]===t?0:probeDuration(t.url),readTags(t.url,t.key)]).then(([d,m])=>{
      if(d)t.duration=d;Object.assign(t,m);renderSoon();
      if(tracks[idx]===t)updateMeta(t);
    }).finally(()=>{metaBusy--;pumpMeta()});
  }
}
const metaGo=()=>{metaReady=true;pumpMeta()};
audio.addEventListener('canplay',metaGo,{once:true});setTimeout(metaGo,2500);
/* следующий трек подгружаем заранее, чтобы переход не ждал сеть */
const warmA=new Audio();warmA.preload='auto';warmA.muted=true;let warmUrl='';
function prefetchNext(){
  if(optOn||shuffle||tracks.length<2||(navigator.connection&&navigator.connection.saveData))return;
  let n=idx+1;if(n>=tracks.length){if(!repeat)return;n=0}
  const u=tracks[n].url;if(u===warmUrl)return;warmUrl=u;warmA.src=u;
}
audio.addEventListener('canplaythrough',prefetchNext);
async function pushTrack(src,url,name){
  const t={url,key:name,...parseName(name),duration:0};
  tracks.push(t);
  if(!optOn||tracks.length===1)render();
  if(idx<0)load(0,false);
  if(!optOn)queueMeta(t);
}

/* ===== Музыка из папки репозитория ===== */
const CONFIG={
  folder:'music',   // папка с песнями в репозитории
  owner:'',         // необязательно: логин GitHub (по умолчанию определяется из адреса сайта)
  repo:''           // необязательно: имя репозитория
};
async function loadLibrary(fresh){
  const h=location.hostname;
  let {owner,repo}=CONFIG;
  if(!owner&&h.endsWith('.github.io')){
    owner=h.split('.')[0];
    const seg=location.pathname.split('/')[1]||'';
    repo=seg&&!seg.includes('.')?seg:h;
  }
  let names=[],folder=CONFIG.folder,why='',shaMap=null,soft=false,rem=0,staleJson=false;
  const isAudio=f=>f.type==='file'&&/\.(mp3|wav)$/i.test(f.name);
  /* основной источник: music/tracks.json (его собирает workflow при каждой публикации, новые сверху) */
  if(!fresh)try{
    const r=await fetch(`${CONFIG.folder}/tracks.json`,{cache:'no-cache'});
    if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length)names=j.filter(x=>typeof x==='string')}
  }catch{}
  /* после переименования файлов tracks.json может устареть: проверяем первый и последний файл списка */
  if(names.length){
    const ex=async n=>{try{return (await fetch(`${CONFIG.folder}/${encodeURIComponent(n)}`,{method:'HEAD',cache:'no-cache'})).ok}catch{return true}};
    const chk=await Promise.all([...new Set([names[0],names[names.length-1]])].map(ex));
    if(chk.includes(false)){names=[];staleJson=true}
  }
  if(names.length){/* список получен без обращения к GitHub API */}
  else if(!owner)why=staleJson?'music/tracks.json устарел: файлы переименованы. Включите Settings → Pages → GitHub Actions или обновите список вручную':'Адрес сайта не github.io: укажите owner и repo в CONFIG или создайте music/tracks.json';
  else{
    try{
      const api=`https://api.github.com/repos/${owner}/${repo}/contents`;
      let r=await fetch(`${api}/${folder}`);
      if(r.status===404){
        const root=await (await fetch(api)).json().catch(()=>[]);
        const dir=Array.isArray(root)&&root.find(f=>f.type==='dir'&&f.name.toLowerCase()===folder.toLowerCase());
        if(dir){folder=dir.name;r=await fetch(`${api}/${folder}`)}
      }
      const h=r.headers.get('x-ratelimit-remaining');if(h!==null)rem=+h;
      if(r.ok){
        const it=(await r.json()).filter(isAudio);names=it.map(f=>f.name);
        shaMap=Object.fromEntries(it.map(f=>[f.name,f.sha]));
        if(names.length)put('pl_list',{folder,names,sha:shaMap});else why='В папке '+folder+' нет файлов mp3 или wav';
      }else if(r.status===403||r.status===429){soft=true;why=staleJson||fresh?'Файл не найден, а список обновить не удалось (лимит GitHub API). Обновите music/tracks.json или включите Pages → GitHub Actions':'Лимит запросов GitHub API: подождите час или создайте music/tracks.json'}
      else why=r.status===404?`Папка ${folder} не найдена в репозитории ${owner}/${repo} (она должна лежать рядом с index.html)`:'Ошибка GitHub API: '+r.status;
    }catch{soft=true;why='Нет связи с GitHub API'}
  }
  if(!names.length&&soft&&!fresh&&!staleJson){
    const c=get('pl_list',null);
    if(c&&c.names&&c.names.length){names=c.names;folder=c.folder;shaMap=c.sha;why=''}
  }
  if(!names.length&&soft){
    for(const br of ['main','master']){
      try{
        const j=await (await fetch(`https://data.jsdelivr.com/v1/packages/gh/${owner}/${repo}@${br}?structure=flat`)).json();
        const pre='/'+folder+'/';
        const f=(j.files||[]).map(x=>x.name).filter(x=>x.startsWith(pre)&&!x.slice(pre.length).includes('/')&&/\.(mp3|wav)$/i.test(x)).map(x=>x.slice(pre.length));
        if(f.length){names=f;why='';break}
      }catch{}
    }
  }
  if(!names.length&&!fresh&&!staleJson){
    try{const j=await (await fetch(`${CONFIG.folder}/tracks.json`)).json();if(Array.isArray(j)&&j.length){names=j;folder=CONFIG.folder}}catch{}
  }
  if(shaMap){
    const dc=get('pl_dates',{});
    names.sort((a,b)=>(dc[shaMap[b]]||'').localeCompare(dc[shaMap[a]]||'')||a.localeCompare(b,'ru',{numeric:true}));
  }
  for(const n of names){
    const url=`${folder}/${encodeURIComponent(n)}`;
    await pushTrack(url,url,n);
  }
  render();
  if(shaMap&&tracks.length&&rem>=25){
    /* даты новых файлов: не больше 12 запросов за визит и только пока есть запас лимита API */
    const dc=get('pl_dates',{}),need=tracks.filter(t=>!dc[shaMap[t.key]]).slice(0,Math.min(12,rem-20));
    if(need.length)Promise.all(need.map(async t=>{
      try{
        const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(folder+'/'+t.key)}&per_page=1`);
        if(!r.ok)return;
        const j=await r.json(),d=j[0]&&j[0].commit.committer.date;
        if(d){dc[shaMap[t.key]]=d;put('pl_dates',dc)}
      }catch{}
    })).then(()=>{
      const cur=tracks[idx];
      tracks.sort((a,b)=>(dc[shaMap[b.key]]||'').localeCompare(dc[shaMap[a.key]]||'')||a.key.localeCompare(b.key,'ru',{numeric:true}));
      idx=cur?tracks.indexOf(cur):-1;render();
    });
  }
  if(!tracks.length){$('title').textContent='Треков пока нет';$('artist').textContent=why||'Добавьте файлы в папку music'}
  else{
    const L=get('pl_last',null),i=L?tracks.findIndex(t=>t.key===L.key):-1;
    if(i>=0){
      if(i!==idx)load(i,false);
      const t0=L.time||0;
      if(audio.readyState>=1)audio.currentTime=t0;else audio.addEventListener('loadedmetadata',()=>{audio.currentTime=t0},{once:true});
    }
  }
}

let rT=0;
const renderSoon=()=>{clearTimeout(rT);rT=setTimeout(render,200)}; /* фоновые обновления (теги, длительность) собираем в одну перерисовку */
function thumb(t,cur){
  const th=document.createElement('div');th.className='t';
  th.style.background=grad(t.title);th.textContent=(t.title[0]||'♪').toUpperCase();
  if(cur){th.textContent='';th.className='t eqon';th.innerHTML='<i></i><i></i><i></i>'}
  return th;
}
function markCur(){ /* смена текущего трека без пересборки списка: не сбрасывает прокрутку и hover */
  list.querySelectorAll('.item').forEach(el=>{
    const i=+el.dataset.i,c=i===idx;
    if(el.classList.contains('cur')===c)return;
    el.classList.toggle('cur',c);
    if(tracks[i])el.replaceChild(thumb(tracks[i],c),el.firstChild);
  });
}
function render(){
  clearTimeout(rT);
  if(!tracks.length){list.innerHTML='<div class="empty">Положите MP3 или WAV в папку <b>music</b> репозитория</div>';return}
  const sy=list.scrollTop;

  const q=$('q').value.trim().toLowerCase();
  tracks.forEach((t,i)=>{
    if(q&&!(t.title+' '+t.artist).toLowerCase().includes(q))return;

    f.onclick=e=>{e.stopPropagation();favs.has(t.key)?favs.delete(t.key):favs.add(t.key);put('pl_fav',[...favs]);favOnly?render():f.classList.toggle('on',favs.has(t.key))};
    const dl=document.createElement('a');dl.className='dl';dl.href=t.url;dl.download=t.key;dl.title='Скачать';dl.setAttribute('aria-label','Скачать '+t.title);dl.innerHTML=DL;dl.onclick=e=>e.stopPropagation();
    d.append(th,info,du,dl,f);
    d.onclick=()=>load(i,true);
    d.onkeydown=e=>{if(e.key==='Enter')load(i,true)};
    list.append(d);
  });
  if(!list.children.length)list.innerHTML='<div class="empty">Ничего не найдено</div>';
  list.scrollTop=sy;
}

function load(i,play){
  idx=i;const t=tracks[i];
  const mt=document.querySelector('.meta');mt.classList.remove('swap');void mt.offsetWidth;mt.classList.add('swap');
  audio.src=t.url;applyRate();
  $('title').textContent=t.title;$('artist').textContent=t.artist;
  document.title=`${t.title} — ${t.artist}`;
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
  }
  markCur();
  wantPlay=!!play;
  if(play){wake();audio.play().catch(()=>{})}
  queueMeta(t,true);
}
function next(auto){
  if(!tracks.length)return;
  if(auto&&repeat===2){audio.currentTime=0;audio.play();return}
  if(auto&&!ST.auto){audio.currentTime=0;return}
  let n;
  if(shuffle&&tracks.length>1){do n=Math.floor(Math.random()*tracks.length);while(n===idx)}
  else n=idx+1;
  if(n>=tracks.length){if(auto&&repeat===0){audio.pause();audio.currentTime=0;return}n=0}
  load(n,true);
}
function prev(){
  if(!tracks.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return}
  load((idx-1+tracks.length)%tracks.length,!audio.paused);
}
let wantPlay=false,healed=false;
async function healLibrary(){ /* файл не найден (переименован/удалён): пересобираем список из реальной папки */
  const wasPlaying=wantPlay||!audio.paused;
  $('artist').textContent='Файл не найден — обновляю список…';
  tracks.length=0;idx=-1;metaQ.length=0;warmUrl='';list.innerHTML='';
  await loadLibrary(true);
  if(wasPlaying&&tracks.length&&idx>=0)load(idx,true);
}
audio.addEventListener('error',()=>{
  if(healed||!audio.getAttribute('src')||!tracks[idx])return;
  healed=true;healLibrary();
});
function wake(){initAudio();if(ac&&ac.state!=='running')ac.resume()}
function toggle(){if(!tracks.length)return;if(audio.paused){wake();audio.play().catch(()=>{})}else audio.pause()}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range'||e.ctrlKey||e.metaKey)return;
  const k=e.key.toLowerCase();
  if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'){e.preventDefault();e.shiftKey?next(false):(audio.currentTime+=5)}
  else if(e.key==='ArrowLeft'){e.preventDefault();e.shiftKey?prev():(audio.currentTime-=5)}
  else if(e.key==='ArrowUp'){e.preventDefault();setVol(Math.min(1,audio.volume+.05))}
  else if(e.key==='ArrowDown'){e.preventDefault();setVol(Math.max(0,audio.volume-.05))}
  else if(k==='m')$('mute').click();
  else if(k==='s')$('shuf').click();
  else if(k==='r')$('rep').click();
  else if(k==='e')cycleFx();
});

/* звук: эквалайзер и анализатор */
let ac,an,bassF,trebF,fx=null;
/* режимы звука: slowed+reverb, nightcore, 8D */
const FX=[
  {s:'Обычный'},
  {s:'Slowed+Reverb',rate:.8,wet:.55,wlp:2600,warm:7500},
  {s:'Nightcore',rate:1.25,wet:.06,wlp:9000},
  {s:'8D',dir:0,pan:1,wet:.22,wlp:5000}
];
const FXD={dir:1,pan:0,wet:0,wlp:6000,warm:20000};
if(!FX[ST.fx])ST.fx=0;
const fxCfg=()=>({...FXD,...FX[ST.fx]});
function makeIR(sec,decay){
  const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate),env=new Float32Array(n);
  for(let i=0;i<n;i++)env[i]=Math.pow(1-i/n,decay);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*env[i]}
  return b;
}
function initAudio(){
  if(ac)return;
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaElementSource(audio);
    bassF=ac.createBiquadFilter();bassF.type='lowshelf';bassF.frequency.value=200;
    trebF=ac.createBiquadFilter();trebF.type='highshelf';trebF.frequency.value=3500;
    an=ac.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.8;
    const warm=ac.createBiquadFilter();warm.type='lowpass';warm.frequency.value=20000;warm.Q.value=.5;
    const dir=ac.createGain(),mix=ac.createGain();
    const lim=ac.createDynamicsCompressor();
    lim.threshold.value=-4;lim.knee.value=6;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.2;
    mix.gain.value=.9;
    /* обычный режим: только эквалайзер -> лимитер, без тяжёлой обработки */
    src.connect(bassF);bassF.connect(trebF);trebF.connect(warm);warm.connect(dir);dir.connect(mix);
    mix.connect(lim);lim.connect(an);an.connect(ac.destination);
    fx={dir,mix,warm};
    applyEq();applyFx(true);
  }catch{ac=null;an=null;fx=null}
}
/* реверберация и 8D создаются и подключаются только когда выбран нужный режим (экономит CPU и батарею) */
function ensureRev(){
  if(fx.conv)return;
  const conv=ac.createConvolver(),wlp=ac.createBiquadFilter(),wet=ac.createGain();
  conv.buffer=makeIR(2.8,2.4);wlp.type='lowpass';wlp.frequency.value=6000;wet.gain.value=0;
  conv.connect(wlp);wlp.connect(wet);wet.connect(fx.mix);
  Object.assign(fx,{conv,wlp,wet,revOn:false});
}
function ensurePan(){
  if(fx.pn||fx.noPan)return;
  const pg=ac.createGain();pg.gain.value=0;
  let pn=ac.createPanner();
  if(pn.positionX){ /* 8D: источник кружит вокруг головы, период 8 с */
    pn.panningModel='HRTF';pn.distanceModel='inverse';pn.rolloffFactor=0;pn.refDistance=1;
    pn.positionX.value=0;pn.positionY.value=0;pn.positionZ.value=0;
    const ox=ac.createOscillator(),oz=ac.createOscillator(),gx=ac.createGain(),gz=ac.createGain();
    ox.frequency.value=oz.frequency.value=.125;gx.gain.value=gz.gain.value=3;
    oz.setPeriodicWave(ac.createPeriodicWave(new Float32Array([0,1]),new Float32Array([0,0])));
    ox.connect(gx);gx.connect(pn.positionX);oz.connect(gz);gz.connect(pn.positionZ);
    ox.start();oz.start();
  }else if(ac.createStereoPanner){
    pn=ac.createStereoPanner();const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=.125;g.gain.value=1;o.connect(g);g.connect(pn.pan);o.start();
  }else{fx.noPan=true;return}
  pn.connect(pg);pg.connect(fx.mix);
  Object.assign(fx,{pn,pg,panOn:false});
}
function applyEq(){if(bassF){bassF.gain.value=ST.bass;trebF.gain.value=ST.treb}}
function applyRate(){
  const c=fxCfg(),r=c.rate||ST.speed;
  audio.preservesPitch=audio.mozPreservesPitch=audio.webkitPreservesPitch=!c.rate; /* slowed/nightcore меняют и тон */
  audio.playbackRate=r;
  const sp=$('sp');
  if(sp){sp.disabled=!!c.rate;$('spv').textContent=c.rate?r+'× (режим)':ST.speed+'×'}
}
function applyFx(now){
  applyRate();
  if(!fx)return;
  const c=fxCfg(),t=ac.currentTime,k=now?.001:.12,wantRev=c.wet>0;
  if(c.pan)ensurePan();
  if(wantRev)ensureRev();
  const panOk=!!(c.pan&&fx.pn);
  if(panOk&&!fx.panOn){fx.warm.connect(fx.pn);fx.panOn=true}
  if(wantRev&&!fx.revOn){fx.warm.connect(fx.conv);fx.revOn=true}
  fx.dir.gain.setTargetAtTime(c.pan&&!panOk?1:c.dir,t,k);
  if(fx.pg)fx.pg.gain.setTargetAtTime(panOk?c.pan*1.25:0,t,k);
  if(fx.wet){fx.wet.gain.setTargetAtTime(c.wet,t,k);fx.wlp.frequency.setTargetAtTime(c.wlp,t,k)}
  fx.warm.frequency.setTargetAtTime(c.warm,t,k);
  if(!panOk&&fx.panOn){fx.panOn=false;setTimeout(()=>{if(!fx.panOn)try{fx.warm.disconnect(fx.pn)}catch{}},700)}
  if(!wantRev&&fx.revOn){fx.revOn=false;setTimeout(()=>{if(!fx.revOn)try{fx.warm.disconnect(fx.conv)}catch{}},1000)}
}
function syncFx(){
  [...$('fxseg').children].forEach((b,j)=>b.setAttribute('aria-pressed',j===ST.fx));
  const b=$('fxBtn');b.textContent=ST.fx?FX[ST.fx].s:'Звук: обычный';b.classList.toggle('on',ST.fx>0);
}
function setFx(i){ST.fx=i;save();applyFx(false);syncFx()}
function cycleFx(){setFx((ST.fx+1)%FX.length)}

/* настройки */
function bind(id,vid,key,f,fn){
  const el=$(id),k=key==='speed'||key==='glow'?100:1;
  el.value=ST[key]*k;
  const show=()=>{$(vid).textContent=f(ST[key]);fill(el)};
  el.oninput=()=>{ST[key]=el.value/k;show();save();fn()};
  show();
}
const db=v=>(v>0?'+':'')+v+' дБ';
bind('gl','glv','glow',v=>v?Math.round(v*100)+'%':'выкл',()=>{});
bind('sp','spv','speed',v=>v+'×',()=>{applyRate()});
bind('bs','bsv','bass',db,applyEq);
bind('tr','trv','treb',db,applyEq);
function seg(id,opts,cur,set){
  const box=$(id),mark=()=>[...box.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===cur()));
  opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{set(i);mark()};box.append(b)});
  mark();
}
seg('fxseg',FX.map(f=>f.s),()=>ST.fx,i=>setFx(i));
$('fxBtn').onclick=cycleFx;syncFx();applyFx(true);
seg('bgseg',['Танцующий','Мягкий'],()=>ST.bgfx,i=>{ST.bgfx=i;save();bgApply()});
seg('autoseg',['Играть дальше','Остановиться'],()=>ST.auto?0:1,i=>{ST.auto=i===0;save()});
seg('vizseg',['Столбцы','Волна','Круг'],()=>ST.viz,i=>{ST.viz=i;save()});
let sleepI=0,sleepEnd=0,sleepT;
seg('sleepseg',['Выкл','15 мин','30 мин','60 мин'],()=>sleepI,i=>{sleepI=i;setSleep([0,15,30,60][i])});
function setSleep(m){clearInterval(sleepT);sleepEnd=m?Date.now()+m*6e4:0;tickSleep();if(m)sleepT=setInterval(tickSleep,1000)}
function tickSleep(){
  const b=$('sleepBadge');
  if(!sleepEnd){b.hidden=true;return}
  const left=sleepEnd-Date.now();
  if(left<=0){audio.pause();$('sleepseg').children[0].click();return}
  b.hidden=false;b.textContent='Сон '+fmt(left/1000);
}
const ov=$('ov'),closeS=()=>{ov.hidden=true};
$('gear').onclick=()=>{ov.hidden=false;fit()};
$('cls').onclick=closeS;
ov.onclick=e=>{if(e.target===ov)closeS()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeS()});
$('q').oninput=()=>render();
$('favOnly').onclick=()=>{favOnly=!favOnly;$('favOnly').classList.toggle('on',favOnly);render()};

/* визуализация вместо обложки */
const cv=$('viz'),cx=cv.getContext('2d'),data=new Uint8Array(128),tmp=new Uint8Array(128);
function fit(){const r=cv.getBoundingClientRect(),d=optOn?1:Math.min(window.devicePixelRatio||1,coarse?1.5:3);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
addEventListener('resize',fit);fit();
let bt=0;const pk=new Float32Array(48),coverEl=$('cover'),ambEl=$('amb');
/* ===== Фон, который танцует под бит (WebGL) ===== */
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;uniform float T,B,M,H,K,I;uniform vec3 C0,C1;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.02+vec2(3.1,1.7);a*=.5;}return v;}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);
  float pulse=B*.7+K*.9;
  vec2 p=uv*(1.5+B*.25);
  vec2 q=vec2(fbm(p+vec2(0.,T*.35)),fbm(p+vec2(5.2,1.3)-T*.3));
  vec2 r=vec2(fbm(p+3.*q+vec2(1.7,9.2)+T*.2),fbm(p+3.*q+vec2(8.3,2.8)-T*.25));
  float f=fbm(p+(2.+K*1.6+B*.8)*r);
  float g=0.;
  for(int i=0;i<5;i++){
    float fi=float(i);
    vec2 c=vec2(sin(T*.55+fi*1.9),cos(T*.47+fi*2.7))*(.42+.3*B+.08*sin(T+fi));
    vec2 d=uv-c;
    g+=(.010+.018*K+.012*B)/(dot(d,d)+.012);
  }
  vec3 C2=mix(C1,C1.gbr,.6);
  vec3 tint=mix(C1,C2,smoothstep(.2,.8,r.x));
  float lum=f*f*1.7;
  vec3 col=C0;
  col+=tint*lum*(.30+.55*pulse+.30*M);
  col+=tint*g*(.45+.9*pulse);
  float ridge=pow(1.-abs(noise(p*5.+vec2(T*.6,-T*.4))*2.-1.),7.);
  col+=C2*ridge*H*.9*lum;
  col=col/(1.+.55*col);
  col*=1.-.5*smoothstep(.35,1.35,length(uv));
  gl_FragColor=vec4(mix(C0,col,I),1.);
}`;
const bgc=$('bg'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let gl=null,glU={},glOK=false,bgOn=false,tt=0,lt=0,kick=0,bavg=0,lastK=0,mdS=0,trS=0,thSeen=-1;
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
let cc0=hexRGB(THEMES[ST.theme][1]),cc1=hexRGB(THEMES[ST.theme][2]),tg0=cc0,tg1=cc1;
function bgInit(){
  try{
    gl=bgc.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'low-power'});
    if(!gl)return false;
    const mk=(ty,src)=>{const sh=gl.createShader(ty);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh};
    const pr=gl.createProgram();
    gl.attachShader(pr,mk(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
    gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error('link');
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
    for(const n of ['R','T','B','M','H','K','I','C0','C1'])glU[n]=gl.getUniformLocation(pr,n);
    bgc.addEventListener('webglcontextlost',e=>{e.preventDefault();glOK=false;bgApply()});
    return true;
  }catch(e){gl=null;return false}
}
function bgFit(){
  if(optOn)return;
  const sc=coarse?.3:Math.min(window.devicePixelRatio||1,1.5)*.5;
  bgc.width=Math.max(2,Math.round(innerWidth*sc));bgc.height=Math.max(2,Math.round(innerHeight*sc));
  if(gl)gl.viewport(0,0,bgc.width,bgc.height);
}
function bgApply(){
  if(!optOn&&ST.bgfx===0&&!glTried){glTried=true;glOK=bgInit();bgFit()}
  bgOn=glOK&&ST.bgfx===0&&!optOn;
  document.body.classList.toggle('gl',bgOn);
}
let glTried=false;
bgFit();addEventListener('resize',bgFit);
const av=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=data[i];return s/((b-a)*255)};
function bgStep(t){
  const dt=Math.min(.05,(t-lt)/1000||.016);lt=t;
  const bs=av(0,4);
  mdS+=(av(4,24)-mdS)*.3;trS+=(av(40,100)-trS)*.3;
  bavg+=(bs-bavg)*Math.min(1,dt*1.5);
  if(!audio.paused&&!calm&&bs>bavg*1.22+.04&&t-lastK>170){kick=1;lastK=t}
  kick*=Math.exp(-dt*5);
  if(thSeen!==ST.theme){thSeen=ST.theme;tg0=hexRGB(THEMES[ST.theme][1]);tg1=hexRGB(THEMES[ST.theme][2])}
  const k=1-Math.exp(-dt*3);
  for(let i=0;i<3;i++){cc0[i]+=(tg0[i]-cc0[i])*k;cc1[i]+=(tg1[i]-cc1[i])*k}
  tt+=dt*(.16+.5*bt+.7*kick)*(calm?.3:1);
  const I=Math.min(2,ST.glow);
  gl.uniform2f(glU.R,bgc.width,bgc.height);
  gl.uniform1f(glU.T,tt);gl.uniform1f(glU.B,bt*I);gl.uniform1f(glU.M,mdS*I);gl.uniform1f(glU.H,trS*I);gl.uniform1f(glU.K,kick*I);
  gl.uniform1f(glU.I,Math.min(1,.55+.45*I));
  gl.uniform3f(glU.C0,cc0[0],cc0[1],cc0[2]);gl.uniform3f(glU.C1,cc1[0],cc1[1],cc1[2]);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function frame(t){
  requestAnimationFrame(frame);
  if(optOn){if(t-lastDraw<41)return;lastDraw=t;if(audio.paused&&!hot)return}
  else if(coarse){if(t-lastDraw<30)return;lastDraw=t}
  const W=cv.width,H=cv.height,d=W/300,N=optOn?28:48;
  if(!audio.paused&&an){an.getByteFrequencyData(tmp);for(let i=0;i<128;i++)data[i]=tmp[i]}
  else if(!audio.paused){for(let i=0;i<128;i++)data[i]=110+90*Math.sin(t/260+i*.4)*Math.sin(t/900+i*.1)}
  else for(let i=0;i<128;i++)data[i]*=.92;
  hot=audio.paused?data.some(v=>v):true;
  bt+=((data[0]+data[1]+data[2]+data[3])/1020-bt)*.25;
  const bv=(bt*ST.glow).toFixed(3);if(!optOn){coverEl.style.setProperty('--beat',bv);ambEl.style.setProperty('--beat',bv)}
  if(bgOn)bgStep(t);
  cx.shadowBlur=0;if(optOn)cx.clearRect(0,0,W,H);else{cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(0,0,W,H);cx.globalCompositeOperation='source-over'}
  cx.fillStyle=cx.strokeStyle=vc;cx.lineCap=cx.lineJoin='round';cx.shadowColor=vc;cx.shadowBlur=optOn?0:16*d*ST.glow;
  const v=i=>data[Math.min(127,Math.floor(i*1.3))]/255,sy=i=>v(Math.abs(i-N/2)*1.6);
  if(ST.viz===0){
    const bw=W/N;
    for(let i=0;i<N;i++){const h=Math.max(6*d,sy(i)*H*.8),x=i*bw+bw*.18;cx.beginPath();cx.roundRect?cx.roundRect(x,(H-h)/2,bw*.64,h,bw*.32):cx.rect(x,(H-h)/2,bw*.64,h);cx.fill();if(!optOn){pk[i]=Math.max(h,pk[i]-H*.006);const ph=pk[i]+8*d;cx.globalAlpha=.7;cx.fillRect(x,(H-ph)/2-3*d,bw*.64,3*d);cx.fillRect(x,(H+ph)/2,bw*.64,3*d);cx.globalAlpha=1}}
  }else if(ST.viz===1){
    cx.beginPath();
    for(let i=0;i<=N;i++){const x=i/N*W,y=H/2-Math.max(2*d,sy(i)*H*.42);i?cx.lineTo(x,y):cx.moveTo(x,y)}
    for(let i=N;i>=0;i--)cx.lineTo(i/N*W,H/2+Math.max(2*d,sy(i)*H*.42));
    cx.closePath();cx.globalAlpha=.35;cx.fill();cx.globalAlpha=1;cx.lineWidth=3*d;cx.stroke();
  }else{
    const R=W*.24,M=optOn?36:72;
    cx.translate(W/2,H/2);cx.rotate(t/5000);cx.lineWidth=3.5*d;
    for(let i=0;i<M;i++){const j=i<M/2?i:M-1-i,l=Math.max(3*d,v(j)*W*.2),a=i/M*Math.PI*2;cx.beginPath();cx.moveTo(Math.cos(a)*R,Math.sin(a)*R);cx.lineTo(Math.cos(a)*(R+l),Math.sin(a)*(R+l));cx.stroke()}
    cx.globalAlpha=.18;cx.beginPath();cx.arc(0,0,R*.85*(1+v(1)*.12),0,7);cx.fill();cx.globalAlpha=1;cx.setTransform(1,0,0,1,0,0);
  }
}
requestAnimationFrame(frame);

/* ===== Режим оптимизации ===== */
let batLow=false;
const lowEnd=()=>(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||matchMedia('(prefers-reduced-data: reduce)').matches;
function optApply(){
  optOn=ST.opt===2||(ST.opt===1&&(lowEnd()||batLow));
  document.body.classList.toggle('opt',optOn);
  $('optv').textContent=optOn?'включена':'';
  if(optOn){coverEl.style.setProperty('--beat',0);ambEl.style.setProperty('--beat',0)}
  bgApply();fit();hot=true;
}
seg('optseg',['Выкл','Авто','Максимум'],()=>ST.opt,i=>{ST.opt=i;save();optApply()});
/* звуковой движок засыпает на паузе и просыпается при воспроизведении (onplay уже делает resume) */
let susT=0;
audio.addEventListener('pause',()=>{clearTimeout(susT);susT=setTimeout(()=>{if(optOn&&audio.paused&&ac&&ac.state==='running')ac.suspend()},600)});
audio.addEventListener('play',()=>clearTimeout(susT));
audio.addEventListener('loadedmetadata',()=>{const t=tracks[idx];if(t&&!t.duration&&isFinite(audio.duration)){t.duration=audio.duration;renderSoon()}});
if(navigator.getBattery)navigator.getBattery().then(b=>{
  const u=()=>{batLow=!b.charging&&b.level<=.2;if(ST.opt===1)optApply()};
  b.addEventListener('levelchange',u);b.addEventListener('chargingchange',u);u();
}).catch(()=>{});
optApply();

render();
loadLibrary();
</script>
