<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плеер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{--bg:#14101f;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--text:#f4f1fa;--muted:#a59fb8;--accent:#8b7cff;--glow:#8b7cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.ambient{position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 40% at 25% 30%,var(--glow),transparent 70%),radial-gradient(35% 35% at 80% 75%,var(--glow),transparent 70%);opacity:.38;filter:blur(60px);transition:background 1s}
.app{position:relative;z-index:1;min-height:100%;max-width:1080px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:32px;align-items:center}
.now{display:flex;flex-direction:column;gap:22px}
.cover{aspect-ratio:1;width:100%;max-width:420px;border-radius:28px;overflow:hidden;background:var(--panel);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);position:relative;transition:transform .5s}
.cover.playing{transform:scale(1.02)}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font:800 96px 'Bricolage Grotesque',sans-serif;color:rgba(255,255,255,.85)}
.meta h1{font:800 clamp(28px,4vw,42px)/1.05 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere}
.meta p{color:var(--muted);margin-top:8px;font-size:18px}
.seek{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek span{min-width:38px}.seek span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(to right,var(--text) var(--p,0%),var(--line) var(--p,0%));cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);border:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:0}
input[type=range]:focus-visible,button:focus-visible,.item:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.controls{display:flex;align-items:center;justify-content:space-between;max-width:420px}
button{background:none;border:0;color:var(--text);cursor:pointer;display:grid;place-items:center;border-radius:50%;width:44px;height:44px;transition:background .2s,color .2s,transform .15s}
button:hover{background:var(--panel)}button:active{transform:scale(.92)}
button svg{width:22px;height:22px;fill:currentColor}
button.on{color:var(--glow)}
.play{width:68px;height:68px;background:var(--text);color:#14101f}
.play:hover{background:#fff}.play svg{width:28px;height:28px}
.vol{display:flex;align-items:center;gap:8px;max-width:420px}
.vol input{max-width:200px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 48px);min-height:340px}
.head{display:flex;justify-content:space-between;align-items:center}
.head h2{font:700 20px 'Bricolage Grotesque',sans-serif}
.add{background:var(--text);color:#14101f;width:auto;border-radius:99px;padding:0 18px;height:40px;font:500 14px 'DM Sans',sans-serif;display:inline-flex;gap:6px;align-items:center}
.add:hover{background:#fff}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:4px;flex:1;margin:0 -8px;padding:0 8px}
.item{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:8px;border-radius:14px;cursor:pointer}
.item:hover{background:var(--panel)}
.item.cur{background:rgba(255,255,255,.12)}
.item .t{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;display:grid;place-items:center;font:700 16px 'Bricolage Grotesque';color:#fff}
.item b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item .x{width:32px;height:32px;opacity:0;color:var(--muted)}
.item:hover .x,.item .x:focus-visible{opacity:1}
.item .x svg{width:16px;height:16px}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px;padding:24px;line-height:1.5}
body.drag .side{border-color:var(--text)}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:16px}.cover{max-width:300px;margin:0 auto}.now{align-items:stretch}.controls,.vol{max-width:none}.side{max-height:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="ambient" id="amb"></div>
<main class="app">
  <section class="now">
    <div class="cover" id="cover"><div class="ph" id="ph">♪</div><img id="art" alt="Обложка"></div>
    <div class="meta"><h1 id="title">Загрузка…</h1><p id="artist">Ищу треки в папке music</p></div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div>
    <div class="controls">
      <button id="shuf" title="Перемешать (S)" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-3.2l-2.4 3.4-1.6-1.1L10.8 6H17V3zM3 7h4.3l7.1 10H17v-3l4 4-4 4v-3h-3.6L6.3 9H3V7zm0 10h3l2.2-3.1 1.6 1.1L7.7 19H3v-2z"/></svg></button>
      <button id="prev" title="Предыдущий (←)" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
      <button id="play" class="play" title="Играть / пауза (пробел)" aria-label="Играть"></button>
      <button id="next" title="Следующий (→)" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button id="rep" title="Повтор (R)" aria-label="Повтор"></button>
    </div>
    <div class="vol">
      <button id="mute" aria-label="Без звука" title="Без звука (M)"></button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость">
    </div>
  </section>
  <aside class="side">
    <div class="head"><h2>Очередь</h2><button class="add" id="addBtn">+ Добавить</button></div>
    <div class="list" id="list"></div>
    <input type="file" id="file" accept="audio/mpeg,audio/wav,audio/x-wav,.mp3,.wav" multiple hidden>
  </aside>
</main>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id);
const audio=$('audio'),list=$('list');
const ICON={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
 muted:'<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.600l1.500 1.500A9 9 0 0 0 21 12c0-4.300-3-7.900-7-8.800v2.100c2.900.9 5 3.500 5 6.700zM4.300 3L3 4.300 7.700 9H3v6h4l5 5v-6.700l4.250 4.250c-.7.5-1.400.9-2.250 1.100v2.100a9 9 0 0 0 3.600-1.800L19.700 21 21 19.700 12 10.700 4.300 3zM12 4L9.900 6.100 12 8.200V4z"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>',
 rep1:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.500v4H13z"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M19 6.400L17.600 5 12 10.600 6.400 5 5 6.400 10.600 12 5 17.600 6.400 19 12 13.400 17.600 19 19 17.600 13.400 12z"/></svg>'};
let tracks=[],idx=-1,shuffle=false,repeat=0,lastVol=.8;

const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const hue=str=>{let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%360;return h};
const grad=t=>`linear-gradient(135deg,hsl(${hue(t)} 60% 55%),hsl(${(hue(t)+50)%360} 65% 38%))`;
const fill=el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');

function parseName(name){
  const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const m=base.split(/\s[-–—]\s/);
  return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'Неизвестный исполнитель',title:base};
}
function readTags(src,name){
  return new Promise(res=>{
    const fb=parseName(name);
    if(!window.jsmediatags)return res(fb);
    jsmediatags.read(src,{
      onSuccess:({tags})=>{
        let pic=null;
        if(tags.picture){const{data,format}=tags.picture;pic=URL.createObjectURL(new Blob([new Uint8Array(data)],{type:format}))}
        res({title:tags.title||fb.title,artist:tags.artist||fb.artist,pic});
      },
      onError:()=>res(fb)
    });
  });
}
function probeDuration(url){
  return new Promise(res=>{const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>res(a.duration);a.onerror=()=>res(0);a.src=url});
}

async function pushTrack(src,url,name){
  const t={url,...await readTags(src,name),duration:0};
  tracks.push(t);
  probeDuration(url).then(d=>{t.duration=d;render()});
  render();
  if(idx<0)load(0,false);
}
async function addFiles(files){
  const ok=[...files].filter(f=>/\.(mp3|wav)$/i.test(f.name)||/audio\/(mpeg|wav|x-wav)/.test(f.type));
  for(const f of ok){const url=URL.createObjectURL(f);await pushTrack(f,url,f.name)}
}

/* ===== Музыка из папки репозитория ===== */
const CONFIG={
  folder:'music',   // папка с песнями в репозитории
  owner:'',         // необязательно: логин GitHub (по умолчанию определяется из адреса сайта)
  repo:''           // необязательно: имя репозитория
};
async function loadLibrary(){
  const h=location.hostname;
  let {owner,repo}=CONFIG;
  if(!owner&&h.endsWith('.github.io')){
    owner=h.split('.')[0];
    const seg=location.pathname.split('/')[1]||'';
    repo=seg&&!seg.includes('.')?seg:h;
  }
  let names=[];
  try{
    if(!owner)throw 0;
    const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${CONFIG.folder}`);
    if(!r.ok)throw 0;
    names=(await r.json()).filter(f=>f.type==='file'&&/\.(mp3|wav)$/i.test(f.name)).map(f=>f.name);
  }catch{
    try{names=await (await fetch(`${CONFIG.folder}/tracks.json`)).json()}catch{}
  }
  names.sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
  for(const n of names){
    const url=`${CONFIG.folder}/${encodeURIComponent(n)}`;
    await pushTrack(url,url,n);
  }
}

function render(){
  if(!tracks.length){list.innerHTML='<div class="empty">Положите MP3 или WAV в папку <b>music</b> репозитория<br>или добавьте файлы с устройства</div>';return}
  list.innerHTML='';
  tracks.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='item'+(i===idx?' cur':'');d.tabIndex=0;
    const th=document.createElement('div');th.className='t';
    th.style.backgroundImage=t.pic?`url(${t.pic})`:grad(t.title);
    if(!t.pic)th.textContent=(t.title[0]||'♪').toUpperCase();
    const info=document.createElement('div');
    info.innerHTML='<b></b><small></small>';
    info.firstChild.textContent=t.title;info.lastChild.textContent=t.artist;
    const du=document.createElement('span');du.className='d';du.textContent=t.duration?fmt(t.duration):'';
    const x=document.createElement('button');x.className='x';x.innerHTML=ICON.x;x.title='Убрать';x.setAttribute('aria-label','Убрать из очереди');
    x.onclick=e=>{e.stopPropagation();removeAt(i)};
    d.append(th,info,du,x);
    d.onclick=()=>load(i,true);
    d.onkeydown=e=>{if(e.key==='Enter')load(i,true)};
    list.append(d);
  });
}

function setAccent(src,t){
  let rgb;
  if(src){
    const im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.drawImage(im,0,0,1,1);const[r,g,b]=x.getImageData(0,0,1,1).data;apply(`rgb(${r},${g},${b})`)};
    im.src=src;
  }else apply(`hsl(${hue(t)} 70% 60%)`);
  function apply(c){document.documentElement.style.setProperty('--glow',c)}
}

function load(i,play){
  idx=i;const t=tracks[i];
  audio.src=t.url;
  $('title').textContent=t.title;$('artist').textContent=t.artist;
  const art=$('art');
  if(t.pic){art.src=t.pic;art.style.display='block';$('ph').style.display='none'}
  else{art.style.display='none';$('ph').style.display='grid';$('ph').textContent=(t.title[0]||'♪').toUpperCase();$('cover').style.background=grad(t.title)}
  if(t.pic)$('cover').style.background='';
  setAccent(t.pic,t.title);
  document.title=`${t.title} — ${t.artist}`;
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:t.pic?[{src:t.pic}]:[]});
  }
  render();
  if(play)audio.play().catch(()=>{});
}
function removeAt(i){
  URL.revokeObjectURL(tracks[i].url);
  tracks.splice(i,1);
  if(!tracks.length){audio.pause();audio.removeAttribute('src');idx=-1;$('title').textContent='Очередь пуста';$('artist').textContent='Добавьте треки';$('art').style.display='none';$('ph').style.display='grid';$('ph').textContent='♪';$('cover').style.background='';document.title='Плеер'}
  else if(i===idx)load(Math.min(i,tracks.length-1),!audio.paused);
  else if(i<idx)idx--;
  render();
}
function next(auto){
  if(!tracks.length)return;
  if(auto&&repeat===2){audio.currentTime=0;audio.play();return}
  let n;
  if(shuffle&&tracks.length>1){do n=Math.floor(Math.random()*tracks.length);while(n===idx)}
  else n=idx+1;
  if(n>=tracks.length){if(auto&&repeat===0){audio.pause();audio.currentTime=0;return}n=0}
  load(n,true);
}
function prev(){
  if(!tracks.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return}
  load((idx-1+tracks.length)%tracks.length,!audio.paused);
}
function toggle(){if(!tracks.length){$('file').click();return}audio.paused?audio.play():audio.pause()}

$('play').innerHTML=ICON.play;$('rep').innerHTML=ICON.rep;$('mute').innerHTML=ICON.vol;
$('play').onclick=toggle;$('next').onclick=()=>next(false);$('prev').onclick=prev;
$('shuf').onclick=()=>{shuffle=!shuffle;$('shuf').classList.toggle('on',shuffle)};
$('rep').onclick=()=>{repeat=(repeat+1)%3;$('rep').innerHTML=repeat===2?ICON.rep1:ICON.rep;$('rep').classList.toggle('on',repeat>0)};
$('addBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};

audio.onplay=()=>{$('play').innerHTML=ICON.pause;$('play').setAttribute('aria-label','Пауза');$('cover').classList.add('playing')};
audio.onpause=()=>{$('play').innerHTML=ICON.play;$('play').setAttribute('aria-label','Играть');$('cover').classList.remove('playing')};
audio.onended=()=>next(true);
audio.onloadedmetadata=()=>{$('dur').textContent=fmt(audio.duration)};
audio.ontimeupdate=()=>{
  if(!audio.duration)return;
  $('cur').textContent=fmt(audio.currentTime);
  if(!seeking){$('seek').value=audio.currentTime/audio.duration*1000;fill($('seek'))}
};
let seeking=false;
const sk=$('seek');
sk.oninput=()=>{seeking=true;fill(sk);$('cur').textContent=fmt(sk.value/1000*audio.duration)};
sk.onchange=()=>{if(audio.duration)audio.currentTime=sk.value/1000*audio.duration;seeking=false};

function setVol(v){
  audio.volume=v;audio.muted=v===0;
  $('vol').value=v*100;fill($('vol'));
  $('mute').innerHTML=v===0?ICON.muted:ICON.vol;
}
$('vol').oninput=e=>{const v=e.target.value/100;if(v>0)lastVol=v;setVol(v)};
$('mute').onclick=()=>setVol(audio.volume===0?lastVol:0);
setVol(.8);fill(sk);

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range'||e.ctrlKey||e.metaKey)return;
  const k=e.key.toLowerCase();
  if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'){e.preventDefault();e.shiftKey?next(false):(audio.currentTime+=5)}
  else if(e.key==='ArrowLeft'){e.preventDefault();e.shiftKey?prev():(audio.currentTime-=5)}
  else if(e.key==='ArrowUp'){e.preventDefault();setVol(Math.min(1,audio.volume+.05))}
  else if(e.key==='ArrowDown'){e.preventDefault();setVol(Math.max(0,audio.volume-.05))}
  else if(k==='m')$('mute').click();
  else if(k==='s')$('shuf').click();
  else if(k==='r')$('rep').click();
});
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack',()=>next(false));
  navigator.mediaSession.setActionHandler('previoustrack',prev);
}

['dragenter','dragover'].forEach(n=>window.addEventListener(n,e=>{e.preventDefault();document.body.classList.add('drag')}));
['dragleave','drop'].forEach(n=>window.addEventListener(n,e=>{e.preventDefault();document.body.classList.remove('drag')}));
window.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
render();
loadLibrary();
</script>
</body>
</html>
